<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - SKU Generator</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f3eee6;
            color: #30251f;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .header {
            text-align: center;
            background-color: #4a2c22;
            color: #fff8ed;
            padding: 30px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            letter-spacing: 2px;
        }

        .header p {
            color: #e8c39e;
        }

        .menu {
            background-color: #fffaf2;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8c3ad;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: white;
            font-size: 15px;
        }

        .order-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background-color: #8b4a32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
        }

        .order-button:hover {
            background-color: #6f3826;
            transform: translateY(-2px);
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8b4a32;
            font-weight: bold;
            text-decoration: none;
        }

        #sku_receipt {
            margin-top: 25px;
            padding: 20px;
            background-color: #f7f0e7;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .sku-code {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: #8b4a32;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>SIMON SAYS</h1>
        <p>RESTAURANT INVENTORY SYSTEM</p>
    </div>

    <div class="menu">

        <h2>📦 SKU Generator</h2>
        <p>Generate product codes for your restaurant inventory.</p>

        <label for="category">Product Category</label>
        <select id="category">
            <option value="Sandwich">Sandwich</option>
            <option value="Seafood">Seafood</option>
            <option value="Egg">Egg Dishes</option>
            <option value="Chicken">Chicken</option>
            <option value="Vegetable">Vegetables</option>
            <option value="Noodles">Noodles</option>
            <option value="Rice">Rice</option>
            <option value="Side">Side Dishes</option>
        </select>

        <label for="product_name">Product Name</label>
        <select id="product_name">
            <option value="Grilled Cheese">Grilled Cheese</option>
            <option value="Grilled Mackerel">Grilled Mackerel</option>
            <option value="Cheese Omelette">Cheese Omelette</option>
            <option value="Veggie Omelette">Omelette w/ Veggies</option>
            <option value="Chicken Nuggets">Chicken Nuggets</option>
            <option value="Crispy Tofu">Crispy Tofu</option>
            <option value="Fried Chicken">Fried Chicken</option>
            <option value="Seafood Boil">Seafood Boil</option>
            <option value="Spicy Ramen">Spicy Ramen</option>
            <option value="Cup of Rice">Cup of Rice</option>
            <option value="Fish and Chips">Fish and Chips</option>
            <option value="French Fries">French Fries</option>
        </select>

        <label for="stock_qty">Stock Quantity</label>
        <input type="number" id="stock_qty"
               min="0" step="1" placeholder="Enter available stock">

        <button class="order-button" py-click="generate_sku">
            Generate SKU
        </button>

        <div id="sku_receipt"></div>

        <a href="index.html" class="back-button">
            ← Back to Receipt Generator
        </a>

    </div>
</div>

<script type="py" src="sku.py"></script>

</body>
</html>
